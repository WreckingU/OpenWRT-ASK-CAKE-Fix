name: Build Mono Gateway (CAKE)

on:
  push:
    branches:
      - mono-25.12.0-rc2
  workflow_dispatch:

jobs:
  build:
    name: Build layerscape/armv8_64b/mono_gateway-dk
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget time

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure build for mono_gateway-dk
        run: |
          echo "CONFIG_DEVEL=y" > .config
          echo "CONFIG_BPF_TOOLCHAIN_HOST=y" >> .config
          echo "CONFIG_TARGET_layerscape=y" >> .config
          echo "CONFIG_TARGET_layerscape_armv8_64b=y" >> .config
          echo "CONFIG_TARGET_layerscape_armv8_64b_DEVICE_mono_gateway-dk=y" >> .config
          make defconfig

      - name: Download package sources
        run: make download -j$(nproc) V=s

      - name: Build
        run: make -j$(nproc) BUILD_LOG=1

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mono-gateway-dk-firmware
          path: bin/targets/layerscape/armv8_64b/
          if-no-files-found: error
